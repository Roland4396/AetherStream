user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr notice;
# Deliberately no worker_shutdown_timeout: reload never kills a long stream.
events { worker_connections 4096; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    map $http_upgrade $stream_connection { default upgrade; '' ''; }
    map $uri $stream_access_log { default 1; /health 0; /ready 0; /admin/runtime 0; /admin/quota-keeper 0; }
    log_format stream escape=json '{"time":"$time_iso8601","method":"$request_method","uri":"$uri","status":$status,"upstream":"$upstream_addr","seconds":$request_time}';
    access_log /dev/stdout stream if=$stream_access_log;
    include /etc/nginx/stream-control/upstream.conf;
    server {
        listen 3002;
        server_name _;
        client_max_body_size 0;
        client_body_timeout 1h;
        keepalive_timeout 65s;
        location / {
            proxy_pass http://stream_active;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $stream_connection;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            gzip off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 7d;
            proxy_send_timeout 7d;
            send_timeout 7d;
            # Inference POSTs must never be replayed against another instance.
            proxy_next_upstream off;
            proxy_intercept_errors off;
        }
    }
}
